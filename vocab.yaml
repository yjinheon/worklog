version: 1

projects:
  tkc-pipeline:           { label: "TKC 파이프라인 구축" }
  cdp-pipeline:           { label: "CDP 배치 파이프라인" }
  data-pipeline-refactor: { label: "데이터 파이프라인 리팩토링 및 통합" }
  pipeline-monitoring:    { label: "데이터 파이프라인 모니터링 체계 구축" }
  worklog-system:         { label: "업무보고/문서 시스템" }
  unclassified:           { label: "분류 없음" }


# repo_project_mappnig
repo_mapping:
  cdp-pipeline:
    default: cdp-pipeline
  tkc-crm-pipeline:
    default: tkc-pipeline
  dagster-pipeline:
    default: data-pipeline-refactor
    overrides:
      - { match: "feat(tkc):", project: tkc-pipeline }
      - { match: "feat(cdp):", project: cdp-pipeline }
      - { match: "feat(mon):", project: pipeline-monitoring }
      - { match: "fix(mon):",  project: pipeline-monitoring }

task_tags:
  - backfill
  - bugfix
  - refactor
  - feature
  - ops
  - meeting
  - research
  - doc

system_tags:
  - elasticsearch
  - clickhouse
  - dagster
  - airflow
  - kafka
  - dbt
  - kubernetes
  - redis
